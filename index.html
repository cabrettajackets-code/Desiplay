<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B9C6FF">
<title>Desi Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header>
    <!-- soft mosque skyline behind the header -->
    <svg class="mosque" viewBox="0 0 360 120" aria-hidden="true" fill="#fff">
      <rect x="178" y="2" width="4" height="16"/>
      <path d="M128 120V74C128 44 150 30 180 18C210 30 232 44 232 74V120Z"/>
      <path d="M92 120V92Q92 72 111 72Q130 72 130 92V120Z"/>
      <path d="M230 120V92Q230 72 249 72Q268 72 268 92V120Z"/>
      <rect x="64" y="52" width="14" height="68"/><path d="M62 52L71 32L80 52Z"/>
      <rect x="282" y="52" width="14" height="68"/><path d="M280 52L289 32L298 52Z"/>
      <rect x="34" y="84" width="10" height="36"/><path d="M32 84L39 68L46 84Z"/>
      <rect x="316" y="84" width="10" height="36"/><path d="M314 84L321 68L328 84Z"/>
    </svg>
    <svg class="spark" style="left:12%;top:46%;width:14px" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-9L2.5-2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5-2.5Z"/></svg>
    <svg class="spark" style="right:10%;top:30%;width:18px" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-9L2.5-2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5-2.5Z"/></svg>
    <svg class="spark" style="left:46%;top:14%;width:10px" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-9L2.5-2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5-2.5Z"/></svg>

    <div class="bar">
      <div class="left">
        <div class="avatar">D</div>
        <div class="coins">
          <span class="coin-ico"><i></i></span><span id="coinCount">100</span>
          <button id="addCoins" aria-label="Add coins">+</button>
        </div>
      </div>
      <button class="lang" id="langBtn" aria-label="Language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="langLabel">Roman Urdu</span>
      </button>
    </div>
  </header>

  <main>
    <!-- GAMES -->
    <section class="panel on" id="tab-games">
      <h1 class="title" data-i18n="games">Games</h1>
      <div class="grid">

        <button class="game wide" data-name="antakshari">
          <span class="rim"><span class="face t1"><h2 data-i18n="antakshari">Antakshari</h2></span></span>
          <span class="art"><svg viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <linearGradient id="gMic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B8"/><stop offset="1" stop-color="#F0A500"/></linearGradient>
              <linearGradient id="gHandle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CF0"/><stop offset="1" stop-color="#3B2B8F"/></linearGradient>
            </defs>
            <g transform="rotate(30 60 60)">
              <rect x="42" y="8" width="36" height="56" rx="18" fill="url(#gMic)"/>
              <path d="M42 26h36M42 36h36M42 46h36" stroke="#C98400" stroke-width="2" opacity=".55"/>
              <rect x="40" y="62" width="40" height="9" rx="4" fill="#3B2B8F"/>
              <rect x="49" y="71" width="22" height="42" rx="9" fill="url(#gHandle)"/>
              <rect x="50" y="14" width="6" height="32" rx="3" fill="#fff" opacity=".5"/>
            </g>
            <g fill="#fff"><ellipse cx="18" cy="92" rx="9" ry="6.5"/><rect x="25" y="58" width="4.5" height="34"/><path d="M29.5 58q16 3 13 18q-5-9-13-9z"/></g>
          </svg></span>
        </button>

        <button class="game" data-name="riddles">
          <span class="rim"><span class="face t2"><h2 data-i18n="riddles">Riddles</h2></span></span>
          <span class="art"><svg viewBox="0 0 120 120" aria-hidden="true">
            <defs><radialGradient id="gQ" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFF1B8"/><stop offset="1" stop-color="#EE9A00"/></radialGradient></defs>
            <circle cx="60" cy="62" r="44" fill="url(#gQ)"/>
            <circle cx="60" cy="62" r="36" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
            <text x="60" y="84" text-anchor="middle" font-size="64" font-weight="800" fill="#fff" stroke="#B87300" stroke-width="3" paint-order="stroke" font-family="Arial, sans-serif">?</text>
            <ellipse cx="44" cy="36" rx="18" ry="8" fill="#fff" opacity=".45" transform="rotate(-28 44 36)"/>
            <path fill="#fff" transform="translate(106 16)" d="M0-9L2.5-2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5-2.5Z"/>
            <path fill="#fff" transform="translate(12 30) scale(.7)" d="M0-9L2.5-2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5-2.5Z"/>
          </svg></span>
        </button>

        <button class="game" data-name="npat">
          <span class="rim"><span class="face t3"><h2 data-i18n="npat">Name Place Animal Thing</h2></span></span>
          <span class="art"><svg viewBox="0 0 120 120" aria-hidden="true">
            <defs><linearGradient id="gPen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#F5A800"/></linearGradient></defs>
            <rect x="14" y="20" width="68" height="88" rx="9" fill="#fff"/>
            <rect x="14" y="20" width="68" height="16" rx="9" fill="#F0508A"/><rect x="14" y="29" width="68" height="7" fill="#F0508A"/>
            <path d="M26 54h44M26 68h44M26 82h30M26 96h38" stroke="#B9B3F0" stroke-width="3" stroke-linecap="round"/>
            <g transform="rotate(38 88 62)">
              <rect x="80" y="12" width="16" height="72" rx="2" fill="url(#gPen)"/>
              <rect x="80" y="12" width="5" height="72" fill="#fff" opacity=".35"/>
              <polygon points="80,84 96,84 88,102" fill="#F6D7A8"/><polygon points="85,95 91,95 88,102" fill="#2B2B4A"/>
              <rect x="80" y="4" width="16" height="11" rx="3" fill="#F0508A"/><rect x="80" y="14" width="16" height="4" fill="#C9C9D8"/>
            </g>
          </svg></span>
        </button>

        <button class="game" data-name="chor">
          <span class="rim"><span class="face t4"><h2 data-i18n="chor">Chor Sipahi</h2></span></span>
          <span class="art"><svg viewBox="0 0 120 120" aria-hidden="true">
            <defs><linearGradient id="gHat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4A78"/><stop offset="1" stop-color="#23234A"/></linearGradient></defs>
            <path d="M30 60Q30 22 60 22Q90 22 90 60Z" fill="url(#gHat)"/>
            <path d="M31 48H89L90 60H30Z" fill="#E3A500"/>
            <ellipse cx="60" cy="60" rx="50" ry="11" fill="#2B2B52"/>
            <path d="M32 68Q60 60 88 68Q92 100 60 108Q28 100 32 68Z" fill="#F2D3AE"/>
            <path d="M33 74Q60 66 87 74L83 90Q60 82 37 90Z" fill="#1B1A3D"/>
            <ellipse cx="47" cy="82" rx="7" ry="5" fill="#fff"/><ellipse cx="73" cy="82" rx="7" ry="5" fill="#fff"/>
            <circle cx="48" cy="82" r="2.6" fill="#1B1A3D"/><circle cx="74" cy="82" r="2.6" fill="#1B1A3D"/>
            <ellipse cx="46" cy="36" rx="12" ry="5" fill="#fff" opacity=".25" transform="rotate(-20 46 36)"/>
          </svg></span>
        </button>

        <button class="game" data-name="tambola">
          <span class="tag" data-i18n="nw">New</span>
          <span class="rim"><span class="face t5"><h2 data-i18n="tambola">Tambola</h2></span></span>
          <span class="art"><svg viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <radialGradient id="gB1" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FF9AB8"/><stop offset="1" stop-color="#C2255C"/></radialGradient>
              <radialGradient id="gB2" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#8CC8FF"/><stop offset="1" stop-color="#2056C8"/></radialGradient>
              <radialGradient id="gB3" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#A5E8A8"/><stop offset="1" stop-color="#2F8F43"/></radialGradient>
            </defs>
            <circle cx="40" cy="74" r="30" fill="url(#gB1)"/><circle cx="40" cy="74" r="17" fill="#fff"/>
            <text x="40" y="82" text-anchor="middle" font-size="22" font-weight="800" fill="#C2255C" font-family="Arial, sans-serif">42</text>
            <ellipse cx="28" cy="56" rx="8" ry="4" fill="#fff" opacity=".5" transform="rotate(-30 28 56)"/>
            <circle cx="86" cy="42" r="25" fill="url(#gB2)"/><circle cx="86" cy="42" r="14" fill="#fff"/>
            <text x="86" y="49" text-anchor="middle" font-size="20" font-weight="800" fill="#2056C8" font-family="Arial, sans-serif">7</text>
            <ellipse cx="76" cy="26" rx="7" ry="3.5" fill="#fff" opacity=".5" transform="rotate(-30 76 26)"/>
            <circle cx="90" cy="94" r="20" fill="url(#gB3)"/><circle cx="90" cy="94" r="11" fill="#fff"/>
            <text x="90" y="100" text-anchor="middle" font-size="15" font-weight="800" fill="#2F8F43" font-family="Arial, sans-serif">90</text>
          </svg></span>
        </button>

      </div>

      <!-- online friends on the main page -->
      <div class="sec-head">
        <h3><span data-i18n="online_friends">Online friends</span><span class="count" id="countHome">0</span></h3>
        <button class="link" id="seeAll" data-i18n="see_all">See all</button>
      </div>
      <div class="flist" id="onlineHome"></div>
    </section>

    <!-- FRIENDS -->
    <section class="panel" id="tab-friends">
      <div class="sec-head" style="margin-top:10px">
        <h3><span data-i18n="online_now">Online now</span><span class="count" id="countAll">0</span></h3>
      </div>
      <div class="flist" id="onlineList"></div>
      <button class="btn block" data-soon="add_friend" data-i18n="add_friend">Add Friend</button>
      <div class="sec-head"><h3 data-i18n="requests">Friend requests</h3></div>
      <div class="row"><b data-i18n="no_requests">No pending requests</b></div>
    </section>

    <!-- MESSAGES -->
    <section class="panel" id="tab-messages">
      <div class="card" style="margin-top:10px">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <h4 data-i18n="no_msgs">No messages yet</h4>
        <p data-i18n="no_msgs_d">Chat with friends and invite them to a game room.</p>
      </div>
    </section>

    <!-- ME -->
    <section class="panel" id="tab-me">
      <div class="row" style="margin-top:10px">
        <b data-i18n="language">Language</b>
        <div class="seg">
          <button data-setlang="en">English</button>
          <button data-setlang="ru">Roman Urdu</button>
        </div>
      </div>
      <div class="card">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        <h4 data-i18n="signin">Sign in</h4>
        <p data-i18n="signin_d">Sign in with Google to save your coins and friends.</p>
        <button class="btn alt" data-soon="signin_g" data-i18n="signin_g">Sign in with Google</button>
      </div>
    </section>
  </main>
</div>

<nav>
  <div class="inner">
    <button class="on" data-tab="games">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="3"/></svg>
      <span data-i18n="nav_games">Games</span></button>
    <button data-tab="friends">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span data-i18n="nav_friends">Friends</span></button>
    <button data-tab="messages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span data-i18n="nav_messages">Messages</span></button>
    <button data-tab="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span data-i18n="nav_me">Me</span></button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
              </html>
