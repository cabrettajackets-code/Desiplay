<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B9C6FF">
<title>Desi Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --soft: #F5F3FF;
    --text: #1B1A3D;
    --muted: #6C6B8C;
    --line: rgba(27,26,61,.10);
    --brand: #5B3FD6;
    --gold: #FFB400;
    --green: #2BC16B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
  body { font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.35; }
  button { font-family: inherit; }
  svg { overflow: visible; }

  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }

  /* ---------- header ---------- */
  header {
    position: relative; overflow: hidden;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 22px;
    background: linear-gradient(180deg, #B9C6FF 0%, #D9DEFF 55%, #FFFFFF 100%);
  }
  .mosque { position: absolute; left: 50%; top: calc(34px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    width: 330px; max-width: 95%; opacity: .55; pointer-events: none; }
  .spark { position: absolute; pointer-events: none; fill: #fff; opacity: .9; }
  header > *:not(.mosque):not(.spark) { position: relative; z-index: 1; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #7C5CF0, #4B2FC0); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 20px; flex: none; box-shadow: 0 0 0 3px #fff, 0 3px 8px rgba(60,40,160,.25); }
  .coins { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.85); border-radius: 999px;
    padding: 3px 5px 3px 4px; font-weight: 800; font-size: 17px; box-shadow: 0 2px 6px rgba(60,40,160,.12); }
  .coin-ico { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE79A, #F2A100);
    display: grid; place-items: center; box-shadow: inset 0 0 0 3px rgba(255,255,255,.55); }
  .coin-ico i { width: 10px; height: 10px; border-radius: 3px; background: #C77C00; transform: rotate(45deg); display: block; }
  .coins button { width: 26px; height: 26px; border-radius: 50%; border: 0; background: transparent;
    color: #F26B1D; font-size: 24px; font-weight: 800; line-height: 1; cursor: pointer; padding: 0; }
  .lang { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.85); color: var(--text); border: 0;
    border-radius: 999px; padding: 9px 13px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 6px rgba(60,40,160,.12); }
  .lang svg { width: 16px; height: 16px; }

  .shortcuts { display: flex; justify-content: space-evenly; margin-top: 22px; }
  .sc { background: none; border: 0; padding: 0; cursor: pointer; color: var(--text); font-size: 14px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
  .ring { width: 66px; height: 66px; border-radius: 50%; padding: 4px; box-shadow: 0 4px 10px rgba(60,40,160,.22); }
  .ring > span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: #fff; }
  .ring svg { width: 30px; height: 30px; }
  .r1 { background: linear-gradient(135deg, #34E0D2, #4B8CF0); }
  .r2 { background: linear-gradient(135deg, #A08CFF, #F0508A); }
  .badge { position: absolute; top: -2px; inset-inline-end: 4px; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px;
    background: var(--green); color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; border: 2px solid #fff; }

  main { padding: 6px 16px 0; }
  .title { margin: 12px 0 16px; font-size: 34px; font-weight: 800; letter-spacing: -.5px; }

  /* ---------- game cards ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 12px; }
  .game { position: relative; display: block; border: 0; padding: 0; background: none; cursor: pointer;
    text-align: start; color: #fff; filter: drop-shadow(0 4px 0 rgba(27,26,61,.20)); transition: transform .12s ease; }
  .game:active { transform: translateY(2px); }
  .game.wide { grid-column: 1 / -1; }
  .rim { display: block; padding: 3px; background: linear-gradient(#FFEFB5, #E3A500 60%, #FFD45C);
    clip-path: polygon(0 50%, 20px 4px, calc(100% - 20px) 4px, 100% 50%, calc(100% - 20px) calc(100% - 4px), 20px calc(100% - 4px)); }
  .face { position: relative; display: flex; align-items: center; overflow: hidden; min-height: 118px; padding: 12px 8px 12px 30px;
    clip-path: polygon(0 50%, 18px 2px, calc(100% - 18px) 2px, 100% 50%, calc(100% - 18px) calc(100% - 2px), 18px calc(100% - 2px)); }
  .game.wide .face { min-height: 112px; padding-left: 34px; }
  .face::before { content: ""; position: absolute; inset: 0;
    background: linear-gradient(rgba(255,255,255,.34), rgba(255,255,255,0) 52%), linear-gradient(rgba(0,0,0,0) 60%, rgba(0,0,0,.16)); }
  .face::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 84% 50%, rgba(255,255,255,.20) 0 46px, transparent 47px),
      radial-gradient(circle at 98% 105%, rgba(255,255,255,.16) 0 34px, transparent 35px),
      radial-gradient(circle at 6% 110%, rgba(255,255,255,.12) 0 30px, transparent 31px),
      radial-gradient(circle, rgba(255,255,255,.38) 0 1.5px, transparent 2.5px) 0 0 / 26px 26px,
      repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 9px, transparent 9px 20px); }
  .game h2 { position: relative; z-index: 1; margin: 0; max-width: 54%; font-size: 17px; font-weight: 800; line-height: 1.15;
    text-shadow: 0 2px 0 rgba(0,0,0,.30); }
  .game.wide h2 { font-size: 26px; max-width: 58%; }
  /* the artwork sits outside the clipped card so it can pop out of the top edge */
  .art { position: absolute; z-index: 2; width: 44%; aspect-ratio: 1; inset-inline-end: 6%; bottom: 8px;
    filter: drop-shadow(0 6px 5px rgba(0,0,0,.28)); pointer-events: none; }
  .game.wide .art { width: 140px; bottom: 6px; inset-inline-end: 4%; }
  .art svg { width: 100%; height: 100%; display: block; }
  .tag { position: absolute; top: -9px; inset-inline-start: 26px; z-index: 3; background: linear-gradient(#FFD45C, #F5A800);
    color: #5A3A00; font-size: 12px; font-weight: 800; padding: 1px 12px; border-radius: 8px; box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .t1 { background: linear-gradient(135deg, #34E0D2, #0E9CA6); }
  .t2 { background: linear-gradient(135deg, #58B0FF, #2866D8); }
  .t3 { background: linear-gradient(135deg, #A08CFF, #5A3FCB); }
  .t4 { background: linear-gradient(135deg, #E2805A, #9A3A28); }
  .t5 { background: linear-gradient(135deg, #FFB347, #EE7410); }

  /* ---------- online friends ---------- */
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 10px; }
  .sec-head h3 { margin: 0; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .count { background: var(--green); color: #fff; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 0 9px; line-height: 20px; }
  .link { background: none; border: 0; color: var(--brand); font-weight: 700; font-size: 14px; cursor: pointer; padding: 4px; }
  .flist { background: var(--soft); border-radius: 20px; padding: 6px 12px; }
  .frow { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .frow + .frow { border-top: 1px solid var(--line); }
  .fav { position: relative; width: 44px; height: 44px; border-radius: 50%; color: #fff; display: grid; place-items: center;
    font-weight: 800; font-size: 18px; flex: none; }
  .fav i { position: absolute; bottom: 0; inset-inline-end: 0; width: 13px; height: 13px; border-radius: 50%;
    background: var(--green); border: 2px solid var(--soft); }
  .finfo { flex: 1; min-width: 0; }
  .finfo b { display: block; font-size: 15px; font-weight: 700; }
  .finfo small { color: var(--green); font-weight: 700; font-size: 12px; }
  .none { padding: 18px 4px; text-align: center; color: var(--muted); font-size: 14px; }

  /* ---------- panels ---------- */
  .panel { display: none; }
  .panel.on { display: block; }
  .card { background: var(--soft); border-radius: 20px; padding: 22px 18px; text-align: center; margin-bottom: 14px; }
  .card .ico { width: 52px; height: 52px; margin: 0 auto 10px; border-radius: 50%; background: rgba(91,63,214,.12);
    display: grid; place-items: center; color: var(--brand); }
  .card .ico svg { width: 26px; height: 26px; }
  .card h4 { margin: 0 0 4px; font-size: 17px; font-weight: 800; }
  .card p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .btn { border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 800; font-size: 15px; background: var(--brand); color: #fff; cursor: pointer; }
  .btn.sm { padding: 7px 16px; font-size: 13px; border-radius: 999px; }
  .btn.alt { background: var(--gold); color: #3B2A00; }
  .btn.block { display: block; width: 100%; margin-top: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--soft); border-radius: 20px; padding: 14px 16px; margin-bottom: 14px; }
  .row b { font-size: 15px; }
  .seg { display: flex; background: #fff; border-radius: 12px; padding: 3px; border: 1px solid var(--line); }
  .seg button { border: 0; background: none; color: var(--muted); padding: 8px 12px; border-radius: 9px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--brand); color: #fff; }

  /* ---------- bottom nav ---------- */
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff;
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 10; }
  nav .inner { display: flex; max-width: 480px; margin: 0 auto; }
  nav button { flex: 1; background: none; border: 0; padding: 10px 0 8px; color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav button svg { width: 24px; height: 24px; }
  nav button.on { color: var(--brand); }

  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(16px); background: #1B1A3D; color: #fff; padding: 10px 18px;
    border-radius: 12px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; z-index: 20;
    transition: .2s; max-width: 90%; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { .toast, .game { transition: none; } }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <!-- soft mosque skyline behind the header -->
    <svg class="mosque" viewBox="0 0 360 120" aria-hidden="true" fill="#fff">
      <rect x="178" y="2" width="4" height="16"/>
      <path d="M128 120V74C128 44 150 30 180 18C210 30 232 44 232 74V120Z"/>
      <path d="M92 120V92Q92 72 111 72Q130 72 130 92V120Z"/>
      <path d="M230 120V92Q230 72 249 72Q268 72 268 92V120Z"/>
      <rect x="64" y="52" width="14" height="68"/><path d="M62 52L71 32L80 52Z"/>
      <rect x="282" y="52" width="14" height="68"/><path d="M280 52L289 32L298 52Z"/>
      <rect x="34" y="84" width="10" height="36"/><path d="M32 84L39 68L46 84Z"/>
      <rect x="316" y="84" width="10" height="36"/><path d="M314 84L321 68L328 84Z"/>
    </svg>
    <svg class="spark" style="left:12%;top:46%;width:14px" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-9L2.5-2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5-2.5Z"/></svg>
    <svg class="spark" style="right:10%;top:30%;width:18px" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-9L2.5-2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5-2.5Z"/></svg>
    <svg class="spark" style="left:46%;top:14%;width:10px" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-9L2.5-2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5-2.5Z"/></svg>

    <div class="bar">
      <div class="left">
        <div class="avatar">D</div>
        <div class="coins">
          <span class="coin-ico"><i></i></span><span id="coinCount">100</span>
          <button id="addCoins" aria-label="Add coins">+</button>
        </div>
      </div>
      <button class="lang" id="langBtn" aria-label="Language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="langLabel">Roman Urdu</span>
      </button>
    </div>
  </header>

  <main>
    <!-- GAMES -->
    <section class="panel on" id="tab-games">
      <h1 class="title" data-i18n="games">Games</h1>
      <div class="grid">

        <button class="game wide" data-name="antakshari">
          <span class="rim"><span class="face t1"><h2 data-i18n="antakshari">Antakshari</h2></span></span>
          <span class="art"><svg viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <linearGradient id="gMic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B8"/><stop offset="1" stop-color="#F0A500"/></linearGradient>
              <linearGradient id="gHandle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CF0"/><stop offset="1" stop-color="#3B2B8F"/></linearGradient>
            </defs>
            <g transform="rotate(30 60 60)">
              <rect x="42" y="8" width="36" height="56" rx="18" fill="url(#gMic)"/>
              <path d="M42 26h36M42 36h36M42 46h36" stroke="#C98400" stroke-width="2" opacity=".55"/>
              <rect x="40" y="62" width="40" height="9" rx="4" fill="#3B2B8F"/>
              <rect x="49" y="71" width="22" height="42" rx="9" fill="url(#gHandle)"/>
              <rect x="50" y="14" width="6" height="32" rx="3" fill="#fff" opacity=".5"/>
            </g>
            <g fill="#fff"><ellipse cx="18" cy="92" rx="9" ry="6.5"/><rect x="25" y="58" width="4.5" height="34"/><path d="M29.5 58q16 3 13 18q-5-9-13-9z"/></g>
          </svg></span>
        </button>

        <button class="game" data-name="riddles">
          <span class="rim"><span class="face t2"><h2 data-i18n="riddles">Riddles</h2></span></span>
          <span class="art"><svg viewBox="0 0 120 120" aria-hidden="true">
            <defs><radialGradient id="gQ" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFF1B8"/><stop offset="1" stop-color="#EE9A00"/></radialGradient></defs>
            <circle cx="60" cy="62" r="44" fill="url(#gQ)"/>
            <circle cx="60" cy="62" r="36" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
            <text x="60" y="84" text-anchor="middle" font-size="64" font-weight="800" fill="#fff" stroke="#B87300" stroke-width="3" paint-order="stroke" font-family="Arial, sans-serif">?</text>
            <ellipse cx="44" cy="36" rx="18" ry="8" fill="#fff" opacity=".45" transform="rotate(-28 44 36)"/>
            <path fill="#fff" transform="translate(106 16)" d="M0-9L2.5-2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5-2.5Z"/>
            <path fill="#fff" transform="translate(12 30) scale(.7)" d="M0-9L2.5-2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5-2.5Z"/>
          </svg></span>
        </button>

        <button class="game" data-name="npat">
          <span class="rim"><span class="face t3"><h2 data-i18n="npat">Name Place Animal Thing</h2></span></span>
          <span class="art"><svg viewBox="0 0 120 120" aria-hidden="true">
            <defs><linearGradient id="gPen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#F5A800"/></linearGradient></defs>
            <rect x="14" y="20" width="68" height="88" rx="9" fill="#fff"/>
            <rect x="14" y="20" width="68" height="16" rx="9" fill="#F0508A"/><rect x="14" y="29" width="68" height="7" fill="#F0508A"/>
            <path d="M26 54h44M26 68h44M26 82h30M26 96h38" stroke="#B9B3F0" stroke-width="3" stroke-linecap="round"/>
            <g transform="rotate(38 88 62)">
              <rect x="80" y="12" width="16" height="72" rx="2" fill="url(#gPen)"/>
              <rect x="80" y="12" width="5" height="72" fill="#fff" opacity=".35"/>
              <polygon points="80,84 96,84 88,102" fill="#F6D7A8"/><polygon points="85,95 91,95 88,102" fill="#2B2B4A"/>
              <rect x="80" y="4" width="16" height="11" rx="3" fill="#F0508A"/><rect x="80" y="14" width="16" height="4" fill="#C9C9D8"/>
            </g>
          </svg></span>
        </button>

        <button class="game" data-name="chor">
          <span class="rim"><span class="face t4"><h2 data-i18n="chor">Chor Sipahi</h2></span></span>
          <span class="art"><svg viewBox="0 0 120 120" aria-hidden="true">
            <defs><linearGradient id="gHat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4A78"/><stop offset="1" stop-color="#23234A"/></linearGradient></defs>
            <path d="M30 60Q30 22 60 22Q90 22 90 60Z" fill="url(#gHat)"/>
            <path d="M31 48H89L90 60H30Z" fill="#E3A500"/>
            <ellipse cx="60" cy="60" rx="50" ry="11" fill="#2B2B52"/>
            <path d="M32 68Q60 60 88 68Q92 100 60 108Q28 100 32 68Z" fill="#F2D3AE"/>
            <path d="M33 74Q60 66 87 74L83 90Q60 82 37 90Z" fill="#1B1A3D"/>
            <ellipse cx="47" cy="82" rx="7" ry="5" fill="#fff"/><ellipse cx="73" cy="82" rx="7" ry="5" fill="#fff"/>
            <circle cx="48" cy="82" r="2.6" fill="#1B1A3D"/><circle cx="74" cy="82" r="2.6" fill="#1B1A3D"/>
            <ellipse cx="46" cy="36" rx="12" ry="5" fill="#fff" opacity=".25" transform="rotate(-20 46 36)"/>
          </svg></span>
        </button>

        <button class="game" data-name="tambola">
          <span class="tag" data-i18n="nw">New</span>
          <span class="rim"><span class="face t5"><h2 data-i18n="tambola">Tambola</h2></span></span>
          <span class="art"><svg viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <radialGradient id="gB1" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FF9AB8"/><stop offset="1" stop-color="#C2255C"/></radialGradient>
              <radialGradient id="gB2" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#8CC8FF"/><stop offset="1" stop-color="#2056C8"/></radialGradient>
              <radialGradient id="gB3" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#A5E8A8"/><stop offset="1" stop-color="#2F8F43"/></radialGradient>
            </defs>
            <circle cx="40" cy="74" r="30" fill="url(#gB1)"/><circle cx="40" cy="74" r="17" fill="#fff"/>
            <text x="40" y="82" text-anchor="middle" font-size="22" font-weight="800" fill="#C2255C" font-family="Arial, sans-serif">42</text>
            <ellipse cx="28" cy="56" rx="8" ry="4" fill="#fff" opacity=".5" transform="rotate(-30 28 56)"/>
            <circle cx="86" cy="42" r="25" fill="url(#gB2)"/><circle cx="86" cy="42" r="14" fill="#fff"/>
            <text x="86" y="49" text-anchor="middle" font-size="20" font-weight="800" fill="#2056C8" font-family="Arial, sans-serif">7</text>
            <ellipse cx="76" cy="26" rx="7" ry="3.5" fill="#fff" opacity=".5" transform="rotate(-30 76 26)"/>
